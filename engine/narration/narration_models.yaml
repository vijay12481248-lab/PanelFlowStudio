roles:
  vision:  {model: "qwen3.5:9b", temperature: 0.1, max_tokens: 1024, num_ctx: 8192, concurrency: 3, timeout_s: 120}
  planner: {model: "qwen3.5:9b", temperature: 0.2, max_tokens: 4096, num_ctx: 16384, concurrency: 1, timeout_s: 180}
  writer:  {model: "qwen3.5:9b", temperature: 0.7, top_p: 0.9, max_tokens: 2048, num_ctx: 8192, concurrency: 1, timeout_s: 180}
  judge:   {model: "qwen3.5:9b", temperature: 0.0, max_tokens: 1024, num_ctx: 8192, concurrency: 1, timeout_s: 120}
tts: {model: "kokoro-82m", voice: "am_michael"}
stt: {model: "base", device: "cpu", compute_type: "int8"}

# The voices a character can be cast to. The narrator's own voice is the first one;
# the rest are the approved cast. Add your own under the same key in
# %LOCALAPPDATA%\PanelFlow Studio\config\narration_models.yaml to replace this list.
voices:
  - {id: "narrator",   name: "The Narrator",    voice: "am_michael", gender: "male"}
  - {id: "aria",       name: "Aria",            voice: "af_heart",   gender: "female"}
  - {id: "bella",      name: "Bella",           voice: "af_bella",   gender: "female"}
  - {id: "nicole",     name: "Nicole",          voice: "af_nicole",  gender: "female"}
  - {id: "sky",        name: "Sky",             voice: "af_sky",     gender: "female"}
  - {id: "adam",       name: "Adam",            voice: "am_adam",    gender: "male"}
  - {id: "fable",      name: "Fable",           voice: "bm_fable",   gender: "male"}
  - {id: "george",     name: "George",          voice: "bm_george",  gender: "male"}
