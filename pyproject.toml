[project]
name = "panelflow-engine"
version = "1.0.0b2"
description = "PanelFlow Studio local production engine"
requires-python = ">=3.12,<3.15"
dependencies = [
  "beautifulsoup4",
  "fastapi",
  "httpx",
  "numpy",
  "opencv-python",
  "pillow",
  "psutil",
  "pydantic",
  "pydantic-settings",
  "pyyaml",
  "scipy",
  "soundfile",
  "sqlalchemy",
  "uvicorn[standard]",
  "torch",
  "kokoro>=0.8.4",
  "edge-tts",
  "faster-whisper",
  "winrt-windows-media-ocr; sys_platform == 'win32'",
  "winrt-windows-graphics-imaging; sys_platform == 'win32'",
  "winrt-windows-storage; sys_platform == 'win32'",
  "winrt-windows-globalization; sys_platform == 'win32'",
  "pytest",
  "pytest-asyncio",
]

[project.optional-dependencies]
test = [
  "pytest",
  "pytest-asyncio",
  "playwright",
]
ocr = [
  "manga-ocr",
  "paddleocr",
]
media = [
  "imageio-ffmpeg",
]
ui-automation = [
  "playwright",
]

[tool.uv]
package = false

# RTX 50-series (Blackwell) needs a CUDA 12.8+ build; PyPI ships CPU-only torch on Windows.
[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
