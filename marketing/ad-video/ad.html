<!doctype html>
<meta charset="utf-8">
<title>PanelFlow Studio - Launch Ad</title>
<style>
:root{--ind:#6366f1;--vio:#8b5cf6;--bg:#080b12;--bg2:#0c0e17;--bg3:#111422;--bd:#1e2538;--tx:#fafafa;--tx2:#a1a1aa;--ok:#34d399}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);font-family:'Segoe UI Variable Display','Segoe UI',system-ui,sans-serif;color:var(--tx)}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--bg)}
.a{position:absolute;left:0;top:0;transform-origin:center center}
.grp{position:absolute;left:0;top:0;width:1920px;height:1080px}
#grid{position:absolute;inset:0;background-image:linear-gradient(rgba(99,102,241,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(99,102,241,.07) 1px,transparent 1px);background-size:90px 90px;-webkit-mask-image:radial-gradient(ellipse at center,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse at center,#000 20%,transparent 75%)}
.glow{position:absolute;width:1100px;height:1100px;border-radius:50%;filter:blur(120px);left:0;top:0}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.65) 100%);pointer-events:none}
.t{white-space:nowrap;font-weight:800;letter-spacing:-2px;line-height:1.08}
.w{display:inline-block;margin-right:.24em;will-change:transform,opacity}
.grad{background:linear-gradient(90deg,#818cf8,#c084fc 60%,#f0abfc);-webkit-background-clip:text;background-clip:text;color:transparent}
.pnl{box-shadow:0 18px 50px rgba(0,0,0,.55)}
.pnl .in{position:absolute;inset:0;overflow:hidden;border-radius:6px;border:4px solid #0a0a12;background:#000}
.pnl svg{width:100%;height:100%;display:block}
.box{position:absolute;inset:-7px;border:3px solid #818cf8;border-radius:10px;box-shadow:0 0 24px rgba(129,140,248,.8),inset 0 0 18px rgba(129,140,248,.25)}
.lbl{position:absolute;left:12px;top:12px;font:700 15px 'Segoe UI';letter-spacing:1px;padding:4px 10px;border-radius:6px;background:#4f46e5;color:#fff;white-space:nowrap}
.card{width:300px;height:420px;border-radius:22px;background:linear-gradient(180deg,#141935,#0c0e17);border:1.5px solid var(--bd)}
.card .cn{position:absolute;left:24px;top:22px;font:800 15px 'Segoe UI';letter-spacing:3px;color:#818cf8}
.card .ct{position:absolute;left:24px;top:46px;font:800 28px 'Segoe UI';letter-spacing:1px}
.card .cm{position:absolute;left:20px;top:100px;width:260px;height:170px;overflow:hidden;border-radius:12px;background:#080b12;border:1px solid var(--bd)}
.card .cd{position:absolute;left:24px;right:24px;top:292px;font-size:19px;line-height:1.3;color:var(--tx2)}
.card .cs{position:absolute;left:24px;bottom:20px;font:700 14px 'Segoe UI';letter-spacing:2px;color:var(--ok)}
.fcard{width:480px;height:420px;border-radius:26px;background:linear-gradient(180deg,#151a38,#0c0e17);border:1.5px solid var(--bd);padding:40px}
.fcard h3{font:800 38px 'Segoe UI';letter-spacing:-1px;margin:26px 0 12px}
.fcard p{font-size:22px;line-height:1.4;color:var(--tx2)}
.ic{width:78px;height:78px;border-radius:20px;background:linear-gradient(135deg,#4f46e5,#8b5cf6);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(99,102,241,.45)}
.chip{display:inline-block;padding:10px 20px;border-radius:999px;border:1px solid #2b3358;background:#12162b;font:600 22px 'Segoe UI';color:#c7d2fe;margin:6px}
.row{position:absolute;left:0;right:0;height:46px}
.row .lb{position:absolute;left:0;top:0;font:600 17px 'Segoe UI';color:var(--tx2)}
.row .pill{position:absolute;right:0;top:-4px;padding:6px 14px;border-radius:8px;background:#161b33;border:1px solid var(--bd);font:600 16px 'Segoe UI';color:#c7d2fe}
.row .tr{position:absolute;left:0;right:0;top:34px;height:6px;border-radius:3px;background:#1a2040}
.row .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,#6366f1,#a78bfa)}
</style>
<div id="stage">
  <div class="glow a" id="g1" style="background:#4338ca;opacity:.38"></div>
  <div class="glow a" id="g2" style="background:#7c3aed;opacity:.28"></div>
  <div id="grid"></div>
  <div id="vig"></div>
</div>
<script>
const $=(s,p=document)=>p.querySelector(s);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eb=x=>{const c=2.70158;return 1+c*Math.pow(x-1,3)+1.70158*Math.pow(x-1,2)};
const lerp=(a,b,k)=>a+(b-a)*k;
const vis=(t,a,b,fi=.4,fo=.4)=>t<a||t>b?0:eo(prog(t,a,a+fi))*(1-eo(prog(t,b-fo,b)));
const DUR=34;
const stage=$('#stage');
function mk(cls,html='',style='',parent=stage){const d=document.createElement('div');d.className=cls;d.innerHTML=html;d.style.cssText=style;parent.appendChild(d);return d}
function tf(el,x,y,s=1,r=0,o=1){el.style.transform=`translate(${x}px,${y}px) translate(-50%,-50%) rotate(${r}deg) scale(${s})`;el.style.opacity=o}
function grp(){return mk('grp','', '',stage)}
function show(g,o){g.style.display=o>.002?'block':'none';g.style.opacity=o}
function words(parent,txt,size,{align='center',width=1500,cls=''}={}){
  const g=cls.includes('grad');cls=cls.replace('grad','');const el=mk('a t '+cls,'',`font-size:${size}px;width:${width}px;text-align:${align};white-space:normal`,parent);
  const sp=[];
  txt.split('|').forEach((line,li,arr)=>{line.split(' ').forEach(w=>{const s=document.createElement('span');s.className='w'+(g?' grad':'');s.textContent=w;el.appendChild(s);sp.push(s)});if(li<arr.length-1)el.appendChild(document.createElement('br'))});
  return {el,sp};
}
function reveal(c,t,start,out,stag=.09,dur=.7){
  c.sp.forEach((s,i)=>{const k=eo(prog(t,start+i*stag,start+i*stag+dur));const f=1-eo(prog(t,out,out+.4));
    s.style.opacity=k*f;s.style.transform=`translateY(${(1-k)*46}px)`;s.style.filter=`blur(${(1-k)*14}px)`});
}
const typed=(s,n)=>s.slice(0,Math.max(0,Math.min(s.length,Math.floor(n))));

/* ---------- comic art ---------- */
const rnd=(s=>()=>(s=(s*16807)%2147483647)/2147483647)(11);
const star=(cx,cy,n,r1,r2)=>{const p=[];for(let i=0;i<n*2;i++){const a=i*Math.PI/n,r=i%2?r1:r2;p.push((cx+Math.cos(a)*r).toFixed(1)+','+(cy+Math.sin(a)*r).toFixed(1))}return p.join(' ')};
const ARTF=[
()=>{let b='',x=0;while(x<400){const w=30+rnd()*40,h=60+rnd()*130;b+=`<rect x="${x}" y="${300-h}" width="${w}" height="${h}" fill="#150d2e"/>`;for(let y=300-h+10;y<290;y+=16)for(let xx=x+6;xx<x+w-8;xx+=12)if(rnd()>.55)b+=`<rect x="${xx}" y="${y}" width="5" height="7" fill="#ffd27a"/>`;x+=w+4}
 return `<defs><linearGradient id="g0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1340"/><stop offset=".55" stop-color="#9b3a8f"/><stop offset="1" stop-color="#ff9a5a"/></linearGradient></defs><rect width="400" height="300" fill="url(#g0)"/><circle cx="290" cy="190" r="62" fill="#ffd27a"/>${b}`},
()=>{let r='';for(let i=0;i<48;i++){const a=i/48*Math.PI*2,a2=a+.045;r+=`<polygon points="200,150 ${200+Math.cos(a)*400},${150+Math.sin(a)*400} ${200+Math.cos(a2)*400},${150+Math.sin(a2)*400}" fill="#000" opacity=".28"/>`}
 return `<rect width="400" height="300" fill="#d11f3d"/>${r}<circle cx="200" cy="150" r="70" fill="#ffe8d0" opacity=".25"/><path d="M120 300 L135 215 Q200 185 265 215 L280 300Z" fill="#0a0a14"/><circle cx="200" cy="170" r="34" fill="#0a0a14"/><path d="M165 150 L150 118 L185 140 L200 105 L215 140 L250 118 L235 150Z" fill="#0a0a14"/><path d="M225 205 Q300 215 330 270 Q285 245 235 235Z" fill="#fff"/>`},
()=>`<defs><clipPath id="ce"><path d="M40 150 Q200 30 360 150 Q200 270 40 150Z"/></clipPath></defs><rect width="400" height="300" fill="#0b0f1d"/><path d="M40 150 Q200 30 360 150 Q200 270 40 150Z" fill="#f4f4fa"/><g clip-path="url(#ce)"><circle cx="200" cy="150" r="62" fill="#6366f1"/><circle cx="200" cy="150" r="62" fill="none" stroke="#312e81" stroke-width="6"/><circle cx="200" cy="150" r="26" fill="#05060c"/><circle cx="178" cy="128" r="14" fill="#fff"/><circle cx="222" cy="170" r="6" fill="#fff" opacity=".8"/></g><path d="M40 150 Q200 30 360 150" fill="none" stroke="#05060c" stroke-width="9"/>`,
()=>{let s='';for(let i=0;i<40;i++)s+=`<circle cx="${rnd()*400}" cy="${rnd()*170}" r="${rnd()*1.6+.4}" fill="#fff" opacity="${.4+rnd()*.6}"/>`;
 return `<defs><linearGradient id="g3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070d24"/><stop offset="1" stop-color="#27508f"/></linearGradient></defs><rect width="400" height="300" fill="url(#g3)"/>${s}<circle cx="140" cy="120" r="64" fill="#f4f1de"/><circle cx="118" cy="104" r="12" fill="#d9d4b8"/><circle cx="165" cy="140" r="9" fill="#d9d4b8"/><circle cx="150" cy="95" r="6" fill="#d9d4b8"/><ellipse cx="260" cy="230" rx="150" ry="36" fill="#1b3a74"/><ellipse cx="90" cy="262" rx="140" ry="34" fill="#16305f"/><ellipse cx="330" cy="285" rx="120" ry="30" fill="#102549"/>`},
()=>`<defs><pattern id="ht" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r="3.2" fill="#ff8c1a"/></pattern></defs><rect width="400" height="300" fill="#ffd23f"/><rect width="400" height="300" fill="url(#ht)"/><polygon points="${star(200,150,14,56,84)}" fill="#e11d48" stroke="#111" stroke-width="5"/><polygon points="${star(200,150,14,40,62)}" fill="#fff25a"/><text x="200" y="164" text-anchor="middle" font-family="Segoe UI Black,Impact,sans-serif" font-size="34" fill="#111" transform="rotate(-8 200 150)">BOOM!</text>`
];
const ART=ARTF.map(f=>f());
const svg=i=>`<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">${ART[i]}</svg>`;

/* ---------- background ---------- */
const g1=$('#g1'),g2=$('#g2'),grid=$('#grid');

/* ---------- S1-S3 : page -> panels ---------- */
const G1=grp();
const PL=[[20,20,580,230],[20,270,280,340],[320,270,280,160],[320,450,280,160],[20,630,580,230]];
const paper=mk('a','', 'width:620px;height:880px;border-radius:10px;background:linear-gradient(160deg,#f7f3ea,#e4dfd0);box-shadow:0 40px 90px rgba(0,0,0,.6)',G1);
const pn=PL.map((l,i)=>{const p=mk('a pnl',`<div class="in">${svg(i)}</div><div class="box"><span class="lbl">PANEL 0${i+1} · ${[98,99,97,98,96][i]}%</span></div>`,'',G1);return p});
const scan=mk('a','','width:640px;height:150px;background:linear-gradient(180deg,transparent,rgba(129,140,248,.28));border-bottom:4px solid #a5b4fc;box-shadow:0 8px 40px rgba(129,140,248,.9)',G1);
const c1=words(G1,'Every story|is trapped|on a page.',118,{align:'left',width:900});
const c1s=mk('a t','Beautiful art. Zero motion.','font-size:34px;font-weight:500;letter-spacing:0;color:#a1a1aa',G1);
const c2=words(G1,'Panel by panel,|it sees the story.',88,{align:'left',width:900});
const c3=words(G1,'The page, rebuilt|as a scene.',84,{width:1500});

const PC=[1400,540],PS=.92;
function pstate(i,t){
  const l=PL[i],k0=eo(prog(t,.15+i*.1,1.25+i*.1));
  const pr=eo(prog(t,0,1.4)),rot=lerp(-5,0,pr),sc=lerp(.78,PS,pr);
  const ox=(l[0]+l[2]/2-310)*sc,oy=(l[1]+l[3]/2-440)*sc,cr=Math.cos(rot*Math.PI/180),sr=Math.sin(rot*Math.PI/180);
  const bob=Math.sin(t*1.5)*6*(1-prog(t,5.8,6.4));
  const A={x:PC[0]+ox*cr-oy*sr,y:PC[1]+ox*sr+oy*cr+bob,w:l[2]*sc,h:l[3]*sc,r:rot,s:lerp(.85,1,k0)};
  const B={x:960+(i-2)*340,y:560+Math.sin(t*1.3+i)*7,w:300,h:210,r:(i-2)*1.6,s:1};
  const C={x:960+(i-2)*250,y:235,w:190,h:130,r:0,s:1};
  const k1=eio(prog(t,6.0+i*.09,7.2+i*.09)),k2=eio(prog(t,9.0+i*.06,10.0+i*.06));
  const m=(a,b,k)=>({x:lerp(a.x,b.x,k),y:lerp(a.y,b.y,k),w:lerp(a.w,b.w,k),h:lerp(a.h,b.h,k),r:lerp(a.r,b.r,k),s:lerp(a.s,b.s,k)});
  return {...m(m(A,B,k1),C,k2),o:k0*(1-eo(prog(t,13.7,14.4)))};
}

/* S3 cards */
const G3=grp();
const STG=[['01','DETECT','Finds every panel and the reading order.'],['02','READ','OCR lifts out every line of dialogue.'],['03','UNDERSTAND','Characters, mood and story beats.'],['04','NARRATE','Voices and delivery, line by line.'],['05','SCORE','Music that follows the scene.']];
const t3=words(G3,'Five AI stages. Zero busywork.',58,{width:1700});
const cards=STG.map((s,i)=>mk('a card',`<div class="cn">${s[0]}</div><div class="ct">${s[1]}</div><div class="cm"></div><div class="cd">${s[2]}</div><div class="cs">✓ COMPLETE</div>`,'',G3));
const track=mk('a','','width:1660px;height:6px;border-radius:3px;background:#1a2040',G3);
const fill=mk('a','','width:1660px;height:6px;border-radius:3px;background:linear-gradient(90deg,#6366f1,#c084fc);box-shadow:0 0 18px #8b5cf6;transform-origin:left center',G3);
const t3b=words(G3,'From a flat page to a finished film.',46,{width:1700,cls:'grad'});
// build minis after cards exist
const mm=cards.map(c=>$('.cm',c));
const upd=[];
{ // DETECT
  const bx=PL.map(l=>mk('a','',`left:${71+l[0]*.185}px;top:${2+l[1]*.185}px;width:${l[2]*.185}px;height:${l[3]*.185}px;background:#1d2547;border:2px solid #818cf8;transform:none;border-radius:2px`,mm[0]));
  upd[0]=t=>bx.forEach((b,i)=>b.style.opacity=eo(prog(t,i*.16,i*.16+.25)));
  // READ
  const L=['“We leave at dawn.”','“Then the war begins.”','— NARRATOR','“Hold the gate!”'];
  const ln=L.map((s,i)=>mk('a','',`left:14px;top:${16+i*38}px;transform:none;font:600 17px Consolas,monospace;color:${i==2?'#a78bfa':'#e0e7ff'};white-space:nowrap`,mm[1]));
  upd[1]=t=>ln.forEach((e,i)=>e.textContent=typed(L[i],(t-i*.45)*26)+((t-i*.45)*26>0&&(t-i*.45)*26<L[i].length?'▍':''));
  // UNDERSTAND
  const T=[['KAI','hero','#34d399'],['REN','rival','#f87171'],['SCENE','dawn, city gate','#fbbf24'],['MOOD','tense','#60a5fa']];
  const tg=T.map((s,i)=>mk('a','',`left:14px;top:${12+i*38}px;transform:none;font:700 16px 'Segoe UI';white-space:nowrap;background:#12162b;border:1px solid #2b3358;border-radius:8px;padding:6px 12px`,mm[2]));
  tg.forEach((e,i)=>e.innerHTML=`<b style="color:${T[i][2]}">${T[i][0]}</b> <span style="color:#a1a1aa;font-weight:500">${T[i][1]}</span>`);
  upd[2]=t=>tg.forEach((e,i)=>{const k=eo(prog(t,i*.3,i*.3+.4));e.style.opacity=k;e.style.transform=`translateX(${(1-k)*30}px)`});
  // NARRATE
  const wb=Array.from({length:26},(_,i)=>mk('a','',`left:${12+i*9.5}px;width:5px;background:linear-gradient(#a78bfa,#6366f1);border-radius:3px;transform:none`,mm[3]));
  upd[3]=t=>wb.forEach((b,i)=>{const h=8+Math.abs(Math.sin(i*.7+t*9)*Math.sin(i*.23+t*3.1))*110*eo(prog(t,0,.5));b.style.height=h+'px';b.style.top=(85-h/2)+'px'});
  // SCORE
  const eq=Array.from({length:14},(_,i)=>mk('a','',`left:${12+i*18}px;width:12px;background:linear-gradient(#f0abfc,#8b5cf6);border-radius:3px;transform:none`,mm[4]));
  upd[4]=t=>eq.forEach((b,i)=>{const h=14+(0.5+0.5*Math.sin(i*.9-t*7))*(60+Math.abs(Math.sin(t*2+i))*60)*eo(prog(t,0,.5));b.style.height=h+'px';b.style.bottom='0';b.style.top=(170-h)+'px'});
}

/* S4 editor */
const G4=grp();
const t4=words(G4,'Direct it. Don’t just render it.',64,{width:1700});
const ED=mk('a',`
 <div style="position:absolute;left:0;top:0;right:0;height:50px;border-bottom:1px solid #1e2538;display:flex;align-items:center;padding:0 22px;gap:9px">
  <i style="width:13px;height:13px;border-radius:50%;background:#ef4444"></i><i style="width:13px;height:13px;border-radius:50%;background:#f59e0b"></i><i style="width:13px;height:13px;border-radius:50%;background:#10b981"></i>
  <span style="margin-left:18px;font:600 17px 'Segoe UI';color:#a1a1aa">PanelFlow Studio  —  Chapter 12  ·  Story Editor</span>
  <span style="margin-left:auto;padding:8px 22px;border-radius:9px;background:linear-gradient(90deg,#4f46e5,#8b5cf6);font:700 16px 'Segoe UI'">Export video</span></div>
 <div id="pv" style="position:absolute;left:24px;top:68px;width:880px;height:495px;border-radius:12px;overflow:hidden;background:#000;border:1px solid #1e2538">
   ${[0,1,2,3,4].map(i=>`<div class="kb" style="position:absolute;inset:0;transform-origin:center">${svg(i)}</div>`).join('')}
   <div id="sub" style="position:absolute;left:50%;bottom:26px;transform:translateX(-50%);max-width:780px;text-align:center;padding:10px 22px;border-radius:10px;background:rgba(5,6,12,.78);font:600 25px 'Segoe UI';line-height:1.3;white-space:nowrap"></div>
   <div style="position:absolute;left:16px;top:14px;padding:5px 12px;border-radius:7px;background:rgba(5,6,12,.7);font:700 14px 'Segoe UI';letter-spacing:2px;color:#c7d2fe">PREVIEW · 1080p</div>
 </div>
 <div style="position:absolute;left:928px;top:68px;width:608px;height:495px;border-radius:12px;background:#0f1226;border:1px solid #1e2538;padding:26px 30px">
   <div style="font:800 20px 'Segoe UI';letter-spacing:3px;color:#818cf8;margin-bottom:22px">INSPECTOR</div>
   <div style="position:relative;height:340px">
    <div class="row" style="top:0"><span class="lb">Camera motion</span><span class="pill">Slow push-in</span><div class="tr"><i id="s1"></i></div></div>
    <div class="row" style="top:76px"><span class="lb">Voice</span><span class="pill">Kai · calm, low</span><div class="tr"><i id="s2"></i></div></div>
    <div class="row" style="top:152px"><span class="lb">Emotion</span><span class="pill">Tense</span><div class="tr"><i id="s3"></i></div></div>
    <div class="row" style="top:228px"><span class="lb">Music</span><span class="pill">Epic Dawn · 92 BPM</span><div class="tr"><i id="s4"></i></div></div>
    <div class="row" style="top:304px"><span class="lb">Transition</span><span class="pill">Cross-dissolve</span></div>
   </div>
 </div>
 <div style="position:absolute;left:24px;top:584px;width:1512px;height:152px;border-radius:12px;background:#0a0c18;border:1px solid #1e2538;overflow:hidden">
   <div style="position:absolute;left:12px;top:12px;font:700 13px 'Segoe UI';color:#71717a;letter-spacing:1px">VIDEO</div>
   <div style="position:absolute;left:12px;top:70px;font:700 13px 'Segoe UI';color:#71717a;letter-spacing:1px">VOICE</div>
   <div style="position:absolute;left:12px;top:112px;font:700 13px 'Segoe UI';color:#71717a;letter-spacing:1px">MUSIC</div>
   <div id="clips" style="position:absolute;left:84px;top:8px;right:12px;height:48px"></div>
   <div id="vox" style="position:absolute;left:84px;top:62px;right:12px;height:34px"></div>
   <div id="mus" style="position:absolute;left:84px;top:104px;right:12px;height:34px"></div>
   <div id="ph" style="position:absolute;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 12px #fff"><i style="position:absolute;left:-6px;top:0;border:7px solid transparent;border-top:10px solid #fff;border-bottom:0"></i></div>
 </div>`,'width:1560px;height:760px;border-radius:20px;background:#0c0e17;border:1.5px solid #262e52;box-shadow:0 50px 120px rgba(0,0,0,.7),0 0 120px rgba(99,102,241,.25)',G4);
const KB=[...ED.querySelectorAll('.kb')],SUB=$('#sub',ED),PH=$('#ph',ED);
const CL=['#d11f3d','#9b3a8f','#6366f1','#27508f','#e0a21b'];
$('#clips',ED).innerHTML=CL.map((c,i)=>`<div style="position:absolute;left:${i*20}%;width:19.6%;top:0;bottom:0;border-radius:7px;background:linear-gradient(180deg,${c},#1b1340);border:1px solid rgba(255,255,255,.25)"></div>`).join('');
const NB=150;
